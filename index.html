<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>GomGom Message</title>

  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --surface-soft: #faf9f6;

      --text: #181818;
      --muted: #77736c;

      --border: #e6e1d8;

      --topic-bg: #fffaf0;
      --topic-border: #eee4ce;

      --post-bg: #eef6ff;
      --post-border: #dcecff;

      --reply-bg: #f3f8f1;
      --reply-border: #dfecdc;

      --black: #111111;

      --hot: #e65353;
      --high: #4d78c9;
      --normal: #b56d96;

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    select,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 12px 40px;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-elephant {
      font-size: 23px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--muted);
    }

    /* =====================================================
       PLATFORM
    ===================================================== */

    .platform-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .platform-tab {
      flex: 1;
      min-height: 34px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--surface);

      color: var(--muted);

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }

    .platform-tab.active {
      background: var(--black);
      border-color: var(--black);
      color: #fff;
    }

    .platform-tab.disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    /* =====================================================
       TOPIC
    ===================================================== */

    .topic-section {
      background: var(--topic-bg);
      border: 1px solid var(--topic-border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .topic-select {
      width: 100%;
      min-height: 40px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: #fff;
      color: var(--text);

      padding: 0 10px;

      font-size: 13px;
      font-weight: 700;
      outline: none;
    }

    .topic-about {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--topic-border);
    }

    .topic-about-title {
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .topic-description {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      white-space: normal;
      word-break: break-word;
    }

    /* =====================================================
       SECTION
    ===================================================== */

    .content-section {
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid;
    }

    .post-section {
      background: var(--post-bg);
      border-color: var(--post-border);
    }

    .reply-section {
      background: var(--reply-bg);
      border-color: var(--reply-border);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 8px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.2px;
    }

    .section-count {
      font-size: 10px;
      color: var(--muted);
    }

    /* =====================================================
       POST CARD
    ===================================================== */

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px;
    }

    .post-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;

      margin-bottom: 6px;
    }

    .post-meta {
      color: var(--muted);
      font-size: 10px;
    }

    .remaining {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    /*
      POST message box intentionally compact
    */

    .post-card .message-box {
      height: auto;
      min-height: 0;
      max-height: 60px;

      padding: 6px 9px;
      margin-bottom: 6px;

      font-size: 12px;
      line-height: 1.4;

      border-radius: 8px;

      overflow-y: auto;
      word-break: break-word;
    }

    .message-box {
      background: var(--surface-soft);
      border: 1px solid var(--border);

      padding: 9px;
      border-radius: 9px;

      font-size: 12px;
      line-height: 1.5;

      min-height: 46px;

      white-space: pre-wrap;
      word-break: break-word;

      overflow-y: auto;
    }

    .message-empty {
      color: #aaa;
    }

    /* =====================================================
       BUTTONS
    ===================================================== */

    .button-row {
      display: flex;
      gap: 6px;
    }

    .btn {
      min-height: 32px;

      border-radius: 8px;
      border: 1px solid var(--border);

      padding: 0 11px;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.12s ease,
        opacity 0.12s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .btn-dark {
      background: var(--black);
      border-color: var(--black);
      color: #fff;
    }

    .btn-light {
      background: #fff;
      color: var(--text);
    }

    .btn-x {
      background: var(--black);
      border-color: var(--black);
      color: #fff;
    }

    /* =====================================================
       REPLY CARDS
    ===================================================== */

    .reply-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .reply-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 11px;

      overflow: hidden;
    }

    .reply-header {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 9px 10px;

      background: #fff;

      border: 0;

      text-align: left;

      cursor: pointer;
    }

    .reply-header:hover {
      background: var(--surface-soft);
    }

    .priority-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;

      flex-shrink: 0;

      font-size: 9px;
      font-weight: 900;

      letter-spacing: 0.3px;
    }

    .priority-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .priority-HOT {
      color: var(--hot);
    }

    .priority-HOT .priority-dot {
      background: var(--hot);
    }

    .priority-HIGH {
      color: var(--high);
    }

    .priority-HIGH .priority-dot {
      background: var(--high);
    }

    .priority-NORMAL {
      color: var(--normal);
    }

    .priority-NORMAL .priority-dot {
      background: var(--normal);
    }

    .reply-account {
      font-size: 11px;
      font-weight: 800;

      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tweet-link {
      display: inline-flex;
      align-items: center;
      gap: 2px;

      margin-left: auto;

      color: var(--muted);

      font-size: 10px;
      text-decoration: none;

      white-space: nowrap;
    }

    .tweet-link:hover {
      color: var(--text);
    }

    .tweet-arrow {
      font-size: 11px;
    }

    .reply-card-status {
      font-size: 9px;
      font-weight: 900;
      color: #4d8a5d;

      white-space: nowrap;
    }

    .reply-chevron {
      font-size: 11px;
      color: var(--muted);

      transition: transform 0.15s ease;
    }

    .reply-card.open .reply-chevron {
      transform: rotate(180deg);
    }

    .reply-body {
      display: none;

      padding: 0 10px 10px;
    }

    .reply-card.open .reply-body {
      display: block;
    }

    .tweet-description {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;

      margin-bottom: 7px;
    }

    .engagement {
      display: flex;
      gap: 10px;

      color: var(--muted);

      font-size: 10px;

      margin-bottom: 7px;
    }

    .engagement span {
      white-space: nowrap;
    }

    .reply-card .message-box {
      max-height: 120px;
      margin-bottom: 7px;
    }

    .reply-actions {
      display: flex;
      gap: 6px;
    }

    /* =====================================================
       LOADING / ERROR
    ===================================================== */

    .loading {
      text-align: center;
      color: var(--muted);
      font-size: 12px;

      padding: 20px 10px;
    }

    .error {
      background: #fff1f1;
      border: 1px solid #f1cccc;

      color: #a33;

      padding: 10px;
      border-radius: 9px;

      font-size: 11px;
      line-height: 1.5;

      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {
      .app {
        padding: 12px 9px 30px;
      }

      .brand-name {
        font-size: 17px;
      }

      .content-section {
        padding: 8px;
      }

      .post-card {
        padding: 8px;
      }

      .reply-header {
        padding: 8px;
      }

      .reply-account {
        max-width: 105px;
      }

      .tweet-link {
        font-size: 9px;
      }

      .btn {
        min-height: 31px;
        padding: 0 10px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- ===================================================

    <header class="brand">
      <div class="brand-title">
        <span class="brand-elephant">🐘</span>

          <div class="brand-name">

    <!-- ===================================================

    <div class="platform-tabs">

  </main>


  <script>
    "use strict";


    /* =====================================================
       CONFIG
    ===================================================== */

    // URL CSV ของ sheet "main"
    const MAIN_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-CnwPK2fSRjsBrmWn3XVIXZEbDFPGguJQeco7B4nNv-7YOcxmIk0ge1846CC5OB8o3sqWK7TwIo_a/pub?output=csv";

    // Spreadsheet ID
    const SPREADSHEET_ID =
      "1RJ7OzLLgvMSKdVTxVfKOqQXir7vXIIyWpa_gImp1PzM";

    // Supabase
    const SUPABASE_URL =
      "https://romrjbyaqckrpvobbzkw.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_4DN0Penjs0vuTYzVdY4-Ug_AmsxurCE";


    /* =====================================================
       GLOBAL STATE
    ===================================================== */

    let subjectRows = [];
    let twSubjectRows = [];

    let topics = [];
    let currentTopic = null;

    let currentPostSheet = null;

    let postMessages = [];

    let replyTweets = [];

    let postSelectedMessage = null;


    /* =====================================================
       DOM
    ===================================================== */

    const topicSelect =
      document.getElementById("topicSelect");

    const topicDescription =
      document.getElementById("topicDescription");

    const errorBox =
      document.getElementById("errorBox");

    const postMessage =
      document.getElementById("postMessage");

    const postRandomBtn =
      document.getElementById("postRandomBtn");

    const postAgainBtn =
      document.getElementById("postAgainBtn");

    const postBtn =
      document.getElementById("postBtn");

    const postRemaining =
      document.getElementById("postRemaining");

    const postMeta =
      document.getElementById("postMeta");

    const postCount =
      document.getElementById("postCount");

    const replyList =
      document.getElementById("replyList");

    const replyCount =
      document.getElementById("replyCount");


    /* =====================================================
       INIT
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      init
    );


    async function init() {

      try {

        validateConfig();

        showLoading();

        const results =
          await Promise.all([
            loadSheet("subject"),
            loadSheet("tw_subject")
          ]);

        subjectRows = results[0];
        twSubjectRows = results[1];

        topics = buildTopics(subjectRows);

        if (!topics.length) {
          throw new Error(
            "ไม่พบ Topic ใน sheet subject"
          );
        }

        renderTopicOptions();

        topicSelect.value =
          topics[0].topicId;

        await selectTopic(
          topics[0].topicId
        );

      } catch (error) {

        console.error(error);

        showError(
          error.message ||
          "เกิดข้อผิดพลาดในการโหลดข้อมูล"
        );

      }

    }


    /* =====================================================
       CONFIG VALIDATION
    ===================================================== */

    function validateConfig() {

      if (
        !SPREADSHEET_ID ||
        SPREADSHEET_ID ===
          "YOUR_GOOGLE_SPREADSHEET_ID"
      ) {
        throw new Error(
          "กรุณาใส่ SPREADSHEET_ID"
        );
      }

      if (
        !SUPABASE_URL ||
        SUPABASE_URL.includes(
          "YOUR_PROJECT"
        )
      ) {
        throw new Error(
          "กรุณาใส่ SUPABASE_URL"
        );
      }

      if (
        !SUPABASE_KEY ||
        SUPABASE_KEY ===
          "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {
        throw new Error(
          "กรุณาใส่ SUPABASE publishable key"
        );
      }

    }


    /* =====================================================
       GOOGLE SHEET
    ===================================================== */

    async function loadSheet(sheetName) {

      const url =
        "https://docs.google.com/spreadsheets/d/" +
        encodeURIComponent(SPREADSHEET_ID) +
        "/gviz/tq?tqx=out:csv&sheet=" +
        encodeURIComponent(sheetName);

      const response =
        await fetch(url);

      if (!response.ok) {
        throw new Error(
          `โหลด sheet ${sheetName} ไม่สำเร็จ`
        );
      }

      const csv =
        await response.text();

      return parseCSV(csv);

    }


    /* =====================================================
       CSV PARSER
    ===================================================== */

    function parseCSV(csv) {

      const rows = [];
      let row = [];
      let value = "";
      let insideQuotes = false;

      for (
        let i = 0;
        i < csv.length;
        i++
      ) {

        const char = csv[i];
        const next = csv[i + 1];

        if (char === '"' && insideQuotes && next === '"') {

          value += '"';
          i++;
          continue;

        }

        if (char === '"') {

          insideQuotes =
            !insideQuotes;

          continue;

        }

        if (char === "," && !insideQuotes) {

          row.push(value);
          value = "";

          continue;

        }

        if (
          (char === "\n" || char === "\r") &&
          !insideQuotes
        ) {

          if (
            char === "\r" &&
            next === "\n"
          ) {
            i++;
          }

          row.push(value);
          value = "";

          if (
            row.some(
              cell =>
                String(cell).trim() !== ""
            )
          ) {
            rows.push(row);
          }

          row = [];

          continue;

        }

        value += char;

      }

      if (
        value !== "" ||
        row.length
      ) {

        row.push(value);

        if (
          row.some(
            cell =>
              String(cell).trim() !== ""
          )
        ) {
          rows.push(row);
        }

      }

      if (!rows.length) {
        return [];
      }


      /*
        Find actual header row.

        This makes the parser tolerate
        metadata rows before the header.
      */

      let headerIndex = 0;

      for (
        let i = 0;
        i < Math.min(rows.length, 10);
        i++
      ) {

        const normalized =
          rows[i]
            .map(normalizeHeader);

        if (
          normalized.includes("message_id") ||
          normalized.includes("topic_id") ||
          normalized.includes("tweet_id") ||
          normalized.includes("text")
        ) {

          headerIndex = i;
          break;

        }

      }


      const headers =
        rows[headerIndex]
          .map(normalizeHeader);

      const result = [];

      for (
        let i = headerIndex + 1;
        i < rows.length;
        i++
      ) {

        const current =
          rows[i];

        const obj = {};

        headers.forEach(
          (header, index) => {

            obj[header] =
              String(
                current[index] ?? ""
              ).trim();

          }
        );

        result.push(obj);

      }

      return result;

    }


    function normalizeHeader(value) {

      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_");

    }


    /* =====================================================
       TOPICS
    ===================================================== */

    function buildTopics(rows) {

      const map =
        new Map();

      for (const row of rows) {

        const topicId =
          String(
            row.topic_id || ""
          ).trim();

        const topicName =
          String(
            row.topic_name || ""
          ).trim();

        if (
          !topicId ||
          !topicName
        ) {
          continue;
        }

        if (!map.has(topicId)) {

          map.set(
            topicId,
            {
              topicId,
              topicName,
              description:
                String(
                  row.topic_desc || ""
                ).trim(),

              postSheet:
                String(
                  row.post_sheet || ""
                ).trim()
            }
          );

        }

      }

      return Array.from(
        map.values()
      );

    }


    function renderTopicOptions() {

      topicSelect.innerHTML = "";

      for (const topic of topics) {

        const option =
          document.createElement("option");

        option.value =
          topic.topicId;

        option.textContent =
          topic.topicName;

        topicSelect.appendChild(
          option
        );

      }

    }


    /* =====================================================
       TOPIC CHANGE
    ===================================================== */

    topicSelect.addEventListener(
      "change",
      async function () {

        const topicId =
          topicSelect.value;

        try {

          await selectTopic(topicId);

        } catch (error) {

          console.error(error);

          showError(
            error.message
          );

        }

      }
    );


    async function selectTopic(topicId) {

      const topic =
        topics.find(
          item =>
            item.topicId ===
            String(topicId)
        );

      if (!topic) {
        return;
      }

      currentTopic =
        topic;

      currentPostSheet =
        getPostSheetName(
          topic
        );

      topicDescription.innerHTML =
        formatTopicDescription(
          topic.description
        );


      resetPost();

      replyList.innerHTML =
        `
          <div class="loading">
            Loading...
          </div>
        `;


      /*
        Load POST and REPLY metadata
        at the same time.
      */

      const [
        posts,
        tweets
      ] = await Promise.all([
        loadPostMessages(
          currentPostSheet
        ),
        Promise.resolve(
          getReplyTweets(
            topic.topicId
          )
        )
      ]);


      postMessages =
        posts;

      replyTweets =
        tweets;


      renderPostInfo();

    async function claimRandomPostMessage() {

      const shuffled =
        shuffle([
          ...postMessages
        ]);


      for (
        const message of shuffled
      ) {

        const claimed =
          await claimPost(
            currentTopic.topicId,
            message.message_id
          );

        if (claimed) {

          const usage =
            await getPostUsage(
              currentTopic.topicId
            );

          return {
            message,
            total:
              postMessages.length,
            remaining:
              Math.max(
                0,
                postMessages.length -
                usage
              )
          };

        }

      }

      return null;

    }


    /* =====================================================
       POST SUPABASE
    ===================================================== */

    async function claimPost(
      topicId,
      messageId
    ) {

      const response =
        await supabaseFetch(
          "/rest/v1/rpc/claim_post_message",
          {
            method: "POST",

            body: JSON.stringify({
              p_topic_id:
                String(topicId),

              p_message_id:
                String(messageId)
            })
          }
        );


      /*
        Supabase RPC boolean response
      */

      if (
        typeof response ===
        "boolean"
      ) {

        return response;

      }


      /*
        Some responses may return:
        [true]
      */

      if (
        Array.isArray(response)
      ) {

        return response[0] === true;

      }

      return false;

    }


    async function getPostUsage(
      topicId
    ) {

      const response =
        await supabaseFetch(
          "/rest/v1/rpc/get_post_usage",
          {
            method: "POST",

            body: JSON.stringify({
              p_topic_id:
                String(topicId)
            })
          }
        );

      return Number(response) || 0;

    }

    /* =====================================================
       REPLY TWEETS
    ===================================================== */

    function getReplyTweets(
      topicId
    ) {

      const map =
        new Map();

      for (
        const row of twSubjectRows
      ) {

        const rowTopicId =
          String(
            row.topic_id || ""
          ).trim();

        if (
          rowTopicId !==
          String(topicId)
        ) {
          continue;
        }


        const tweetId =
          String(
            row.tweet_id || ""
          ).trim();


        /*
          Ignore #N/A and invalid IDs
        */

        if (
          !isValidTweetId(
            tweetId
          )
        ) {
          continue;
        }


        if (
          map.has(tweetId)
        ) {
          continue;
        }


        const accName =
          String(
            row.acc_name || ""
          ).trim();


        const linkPost =
          String(
            row.link_post || ""
          ).trim();


        const tweetDesc =
          String(
            row.tweet_desc || ""
          ).trim();


        const priority =
          normalizePriority(
            row.priority
          );


        map.set(
          tweetId,
          {
            tweetId,
            accName:
              accName ||
              "Unknown",

            linkPost,

            likes:
              row.likes || "",

            replies:
              row.replies || "",

            reposts:
              row.reposts || "",

            priority,

            tweetDesc
          }
        );

      }

      return Array.from(
        map.values()
      );

    }

    /* =====================================================
       REPLY CLAIM
    ===================================================== */

    async function claimRandomReplyMessage(
      tweet
    ) {

      const sheetName =
        `R_${tweet.tweetId}`;


      const rows =
        await loadSheet(
          sheetName
        );


      const messages =
        rows.filter(
          row => {

            const id =
              String(
                row.message_id || ""
              ).trim();

            const text =
              String(
                row.text || ""
              ).trim();

            return (
              id &&
              text
            );

          }
        );


      if (!messages.length) {

        throw new Error(
          `ไม่พบข้อความใน ${sheetName}`
        );

      }


      const shuffled =
        shuffle([
          ...messages
        ]);


      for (
        const message of shuffled
      ) {

        const claimed =
          await claimReply(
            tweet.tweetId,
            message.message_id
          );


        if (claimed) {

          const usage =
            await getReplyUsage(
              tweet.tweetId
            );


          return {
            message,

            total:
              messages.length,

            remaining:
              Math.max(
                0,
                messages.length -
                usage
              )
          };

        }

      }


      return null;

    }

    /* =====================================================
       SUPABASE FETCH
    ===================================================== */

    async function supabaseFetch(
      path,
      options = {}
    ) {

      const response =
        await fetch(
          SUPABASE_URL +
          path,
          {
            ...options,

            headers: {
              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`,

              "Content-Type":
                "application/json",

              "Accept":
                "application/json",

              ...(options.headers || {})
            }
          }
        );


      if (!response.ok) {

        const text =
          await response.text();

        throw new Error(
          `Supabase error ${response.status}: ${text}`
        );

      }


      const text =
        await response.text();


      if (!text) {
        return null;
      }


      try {

        return JSON.parse(text);

      } catch {

        return text;

      }

    }

       X URL
    ===================================================== */

    function createPostUrl(
      text
    ) {

      return (
        "https://twitter.com/intent/tweet" +
        "?text=" +
        encodeURIComponent(text)
      );

    }


    function createReplyUrl(
      tweetId,
      text
    ) {

      return (
        "https://x.com/intent/tweet" +
        "?in_reply_to=" +
        encodeURIComponent(tweetId) +
        "&text=" +

      );

    function getTweetUrl(
      tweetId
    ) {

      if (!tweetId) {
        return "#";
      }

      return (
        "https://x.com/i/status/" +
        encodeURIComponent(tweetId)
      );

    }

        "_blank",
        "noopener,noreferrer"
      );

    }


    /* =====================================================
       HELPERS
    ===================================================== */

    function isValidTweetId(
      value
    ) {

      return /^\d+$/.test(
        String(value || "").trim()
      );

    }


    function maskTweetId(
      tweetId
    ) {

      const id =
        String(
          tweetId || ""
        ).trim();


      if (!id) {
        return "••••••••";
      }


      if (id.length <= 4) {

        return (
          "••••" +
          id
        );

      }


      return (
        "••••••••" +
        id.slice(-4)
      );

    }


    function formatCount(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
      ) {

        return "—";

      }


      const number =
        Number(
          String(value)
            .replace(/,/g, "")
            .trim()
        );


      if (
        !Number.isFinite(number)
      ) {

        return String(value);

      }


      if (
        number >= 1_000_000
      ) {

        return (
          (number / 1_000_000)
            .toFixed(1)
            .replace(".0", "") +
          "M"
        );

      }


      if (
        number >= 1_000
      ) {

        return (
          (number / 1_000)
            .toFixed(1)
            .replace(".0", "") +
          "K"
        );

      }


      return String(number);

    }


    function normalizePriority(
      value
    ) {

      const priority =
        String(
          value || "NORMAL"
        )
          .trim()
          .toUpperCase();


      if (
        [
          "HOT",
          "HIGH",
          "NORMAL"
        ].includes(priority)
      ) {

        return priority;

      }


      return "NORMAL";

    }


    function formatTopicDescription(
      text
    ) {

      return escapeHtml(
        String(
          text || ""
        ).trim()
      )
        .replace(
          /&lt;br\s*\/?&gt;/gi,
          "<br>"
        )
        .replace(
          /\r?\n/g,
          "<br>"
        );

    }


    function escapeHtml(
      text
    ) {

      return String(text)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function shuffle(
      array
    ) {

      for (
        let i = array.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          array[i],
          array[j]
        ] = [
          array[j],
          array[i]
        ];

      }

      return array;

    }

      replyList.innerHTML =
        `
          <div class="loading">
            Loading...
          </div>
        `;

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      errorBox.textContent =
        String(message || "Unknown error");

      errorBox.classList.remove(
        "hidden"
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

  </script>

</body>
</html>
