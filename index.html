<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Reply on X</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f5f5f5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    .loading {
      text-align: center;
      color: #666;
    }

    .item {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 16px;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .text {
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 16px;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .tweet-id {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }

    .reply-button {
      display: block;
      width: 100%;
      padding: 14px;

      border-radius: 999px;

      background: #000;
      color: #fff;

      text-align: center;
      text-decoration: none;

      font-size: 16px;
      font-weight: 700;
    }

    .reply-button:active {
      transform: scale(0.98);
    }

    .error {
      text-align: center;
      color: #d00;

      background: white;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>


<body>

  <div class="container">

    <h1>Reply on X</h1>

    <div id="content">

      <p class="loading">
        กำลังโหลดข้อมูล...
      </p>

    </div>

  </div>


  <script>

    /*
     * =====================================
     * Google Sheets CSV URL
     * =====================================
     */

    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-CnwPK2fSRjsBrmWn3XVIXZEbDFPGguJQeco7B4nNv-7YOcxmIk0ge1846CC5OB8o3sqWK7TwIo_a/pub?output=csv";


    /*
     * =====================================
     * โหลดข้อมูลจาก Google Sheets
     * =====================================
     */

    async function loadData() {

      const content =
        document.getElementById("content");

      try {

        const response =
          await fetch(CSV_URL);

        if (!response.ok) {
          throw new Error(
            "โหลด Google Sheets ไม่สำเร็จ"
          );
        }

        const csv =
          await response.text();

        const rows =
          parseCSV(csv);


        /*
         * เอา header ออก
         */

        const headers =
          rows.shift();


        /*
         * หา column
         */

        const tweetIdIndex =
          headers.indexOf("tweet_id");

        const textIndex =
          headers.indexOf("text");


        if (
          tweetIdIndex === -1 ||
          textIndex === -1
        ) {

          throw new Error(
            "ต้องมี column tweet_id และ text"
          );

        }


        content.innerHTML = "";


        /*
         * สร้างปุ่มแต่ละแถว
         */

        rows.forEach(row => {

          const tweetId =
            row[tweetIdIndex]?.trim();

          const text =
            row[textIndex]?.trim();


          if (!tweetId || !text) {
            return;
          }


          /*
           * สร้าง X Reply URL
           */

          const xUrl =
            "https://x.com/intent/tweet" +
            "?in_reply_to=" +
            encodeURIComponent(tweetId) +
            "&text=" +
            encodeURIComponent(text);


          /*
           * สร้าง card
           */

          const item =
            document.createElement("div");

          item.className = "item";


          item.innerHTML = `

            <div class="text">
              ${escapeHtml(text)}
            </div>

            <div class="tweet-id">
              Tweet ID: ${escapeHtml(tweetId)}
            </div>

            <a
              class="reply-button"
              href="${xUrl}"
              target="_blank"
              rel="noopener noreferrer">

              Reply on X

            </a>

          `;


          content.appendChild(item);

        });


        if (!content.children.length) {

          content.innerHTML = `
            <div class="error">
              ไม่พบข้อมูล
            </div>
          `;

        }

      }

      catch (error) {

        console.error(error);

        content.innerHTML = `
          <div class="error">
            โหลดข้อมูลไม่สำเร็จ
            <br><br>
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    /*
     * =====================================
     * CSV Parser
     * =====================================
     */

    function parseCSV(csv) {

      const rows = [];

      let row = [];

      let value = "";

      let insideQuotes = false;


      for (
        let i = 0;
        i < csv.length;
        i++
      ) {

        const char = csv[i];

        const next = csv[i + 1];


        if (
          char === '"' &&
          insideQuotes &&
          next === '"'
        ) {

          value += '"';
          i++;

        }

        else if (char === '"') {

          insideQuotes =
            !insideQuotes;

        }

        else if (
          char === "," &&
          !insideQuotes
        ) {

          row.push(value);
          value = "";

        }

        else if (
          (char === "\n" || char === "\r") &&
          !insideQuotes
        ) {

          if (
            char === "\r" &&
            next === "\n"
          ) {
            i++;
          }

          row.push(value);
          value = "";

          if (
            row.some(
              cell => cell !== ""
            )
          ) {
            rows.push(row);
          }

          row = [];

        }

        else {

          value += char;

        }

      }


      if (value || row.length) {

        row.push(value);

        if (
          row.some(
            cell => cell !== ""
          )
        ) {
          rows.push(row);
        }

      }


      return rows;
    }


    /*
     * =====================================
     * ป้องกัน HTML injection
     * =====================================
     */

    function escapeHtml(value) {

      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /*
     * =====================================
     * Start
     * =====================================
     */

    loadData();

  </script>

</body>

</html>
